<!doctype html>
<html lang="en" data-theme="gta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wiki</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/themes.css">
  <script src="/js/theme-boot.js"></script>
  <script src="/vendor/marked.min.js" defer></script>
  <script src="/vendor/purify.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
    <a class="brand" href="/" data-link><span class="brand-mark"></span><span id="siteName">Wiki</span></a>
    <div class="ns-switch" id="nsSwitch"></div>
    <form id="searchForm" role="search"><input id="searchInput" type="search" placeholder="Search…  ( / )" aria-label="Search" autocomplete="off"></form>
    <div class="top-actions" id="topActions"></div>
  </header>
  <div class="layout">
    <aside id="sidebar"></aside>
    <div id="scrim"></div>
    <main id="view"><div class="loading">Loading…</div></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
