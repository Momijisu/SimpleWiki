# docker compose up -d   → the wiki on http://localhost:8080
# Put it behind a reverse proxy with HTTPS for real use (see docs/DEPLOY.md).
services:
  wiki:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Set to 1 when a reverse proxy (nginx, Caddy, Cloudflare) sits in front.
      TRUST_PROXY: "1"
      # Your wiki's public address, used in link previews on Discord etc.
      PUBLIC_URL: "https://wiki.example.com"
      # Sign in with Discord (see the README). Leave empty to turn it off.
      DISCORD_CLIENT_ID: ""
      DISCORD_CLIENT_SECRET: ""
      DISCORD_GUILD_ID: ""
      DISCORD_MOD_ROLE_IDS: ""
      DISCORD_ADMIN_ROLE_IDS: ""
    volumes:
      - wiki-data:/data

# A named volume, so the wiki (running as the unprivileged "node" user) can write to it.
# Back it up with:  docker compose exec wiki node tools/backup.js /data/backups
volumes:
  wiki-data:
